<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aroma Bistro & Bar - Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 pb-24">

  <!-- Header -->
  <header class="bg-amber-800 text-white p-4 text-center shadow-md sticky top-0 z-10">
    <h1 class="text-2xl font-bold">Aroma Bistro & Bar</h1>
    <p id="table-info" class="text-sm font-medium text-amber-200 mt-1">Maca: Loading...</p>
  </header>

  <!-- Menu Content -->
  <main class="max-w-md mx-auto p-4 space-y-6">
    
    <!-- Kafa & Napici -->
    <section class="bg-white rounded-lg shadow p-4">
      <h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-3">☕ Кафе & Пијалоци</h2>
      <div class="space-y-3">
        <div class="flex justify-between items-center">
          <div>
            <p class="font-semibold text-gray-800">Еспресо</p>
            <p class="text-sm text-gray-500">80 DEN</p>
          </div>
          <button onclick="addToCart('Еспресо', 80)" class="bg-amber-600 text-white px-3 py-1 rounded-md hover:bg-amber-700">+ Додај</button>
        </div>
        <div class="flex justify-between items-center">
          <div>
            <p class="font-semibold text-gray-800">Капучино</p>
            <p class="text-sm text-gray-500">100 DEN</p>
          </div>
          <button onclick="addToCart('Капучино', 100)" class="bg-amber-600 text-white px-3 py-1 rounded-md hover:bg-amber-700">+ Додај</button>
        </div>
        <div class="flex justify-between items-center">
          <div>
            <p class="font-semibold text-gray-800">Макијато</p>
            <p class="text-sm text-gray-500">90 DEN</p>
          </div>
          <button onclick="addToCart('Макијато', 90)" class="bg-amber-600 text-white px-3 py-1 rounded-md hover:bg-amber-700">+ Додај</button>
        </div>
      </div>
    </section>

    <!-- Sokovi & Voda -->
    <section class="bg-white rounded-lg shadow p-4">
      <h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-3">🥤 Сокови & Вода</h2>
      <div class="space-y-3">
        <div class="flex justify-between items-center">
          <div>
            <p class="font-semibold text-gray-800">Газирана вода 0.25l</p>
            <p class="text-sm text-gray-500">70 DEN</p>
          </div>
          <button onclick="addToCart('Газирана вода 0.25l', 70)" class="bg-amber-600 text-white px-3 py-1 rounded-md hover:bg-amber-700">+ Додај</button>
        </div>
        <div class="flex justify-between items-center">
          <div>
            <p class="font-semibold text-gray-800">Coca-Cola 0.25l</p>
            <p class="text-sm text-gray-500">110 DEN</p>
          </div>
          <button onclick="addToCart('Coca-Cola 0.25l', 110)" class="bg-amber-600 text-white px-3 py-1 rounded-md hover:bg-amber-700">+ Додај</button>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Bar (Kosnica) -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-between items-center shadow-lg max-w-md mx-auto">
    <div>
      <span class="text-gray-600 text-sm">Кошничка:</span>
      <span id="cart-count" class="font-bold text-lg text-amber-800 ml-1">0</span>
    </div>
    <button onclick="openCartModal()" class="bg-amber-800 text-white px-5 py-2 rounded-lg font-bold hover:bg-amber-900">
      Прегледај кошничка
    </button>
  </div>

  <!-- Modal za Kosnicu -->
  <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-20">
    <div class="bg-white rounded-lg p-6 w-full max-w-sm space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-xl font-bold text-gray-800">Вашата нарачка</h3>
        <button onclick="closeCartModal()" class="text-gray-500 hover:text-gray-700 text-xl font-bold">✕</button>
      </div>
      
      <div id="cart-items" class="max-h-60 overflow-y-auto divide-y">
        <!-- Ovde se dinamicki dodaju artikli -->
      </div>

      <div class="flex justify-between items-center border-t pt-3 font-bold text-lg">
        <span>Вкупно:</span>
        <span id="modal-total-price" class="text-amber-700">0 DEN</span>
      </div>

      <button onclick="sendOrder()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">
        Испрати нарачка
      </button>
    </div>
  </div>

  <!-- JavaScript Kod -->
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwrRXYx5VjMFUI8bMEGYtZeZynnhg2VBVQLEWty1xONTZ8XFZ0f0HPCLeXfrm428jp-";

    const urlParams = new URLSearchParams(window.location.search);
    const tableNumber = urlParams.get('sto') || 'Непознато';
    document.getElementById('table-info').innerText = "Maca: " + tableNumber;

    let cart = [];

    function addToCart(item, price) {
      cart.push({ item, price });
      updateCartUI();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
      renderCartItems();
    }

    function updateCartUI() {
      const cartCount = document.getElementById('cart-count');
      if (cartCount) cartCount.innerText = cart.length;
    }

    function openCartModal() {
      renderCartItems();
      document.getElementById('cart-modal').classList.remove('hidden');
    }

    function closeCartModal() {
      document.getElementById('cart-modal').classList.add('hidden');
    }

    function renderCartItems() {
      const cartItemsContainer = document.getElementById('cart-items');
      const modalTotalPrice = document.getElementById('modal-total-price');
      if (!cartItemsContainer) return;

      cartItemsContainer.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p class="text-gray-500 text-center py-4">Кошничката е празна</p>';
        if (modalTotalPrice) modalTotalPrice.innerText = "0 DEN";
        return;
      }

      cart.forEach((cartItem, index) => {
        total += cartItem.price;
        const itemRow = document.createElement('div');
        itemRow.className = 'flex justify-between items-center py-2';
        itemRow.innerHTML = `
          <div>
            <p class="font-semibold text-gray-800">${cartItem.item}</p>
            <p class="text-sm text-gray-500">${cartItem.price} DEN</p>
          </div>
          <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 font-bold px-2 py-1">
            ✕
          </button>
        `;
        cartItemsContainer.appendChild(itemRow);
      });

      if (modalTotalPrice) modalTotalPrice.innerText = total + " DEN";
    }

    function sendOrder() {
      if (cart.length === 0) {
        alert("Вашата кошничка е празна!");
        return;
      }

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      const itemsList = cart.map(i => i.item).join(", ");

      const payload = {
        table: tableNumber,
        items: itemsList,
        total: total
      };

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("Вашата нарачка е успешно испратена!");
        cart = [];
        updateCartUI();
        closeCartModal();
      })
      .catch(error => {
        alert("Грешка при испраќање.");
        console.error(error);
      });
    }
  </script>
</body>
</html>
